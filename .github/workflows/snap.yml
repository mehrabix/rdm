name: Snap

# Builds and publishes the snap. It must run on a host matching the snap's
# `base:` (core24) — snapcraft refuses a core24 build on a 26.04 host, and LXD
# builds need container networking, so the 24.04 runner is the reliable place.
#
# The store credential comes from `snapcraft export-login` and lives in the
# SNAPCRAFT_STORE_CREDENTIALS secret.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install snapcraft
        run: |
          sudo snap install snapcraft --classic
          snapcraft --version

      - name: Stage the manifest at the project root
        run: cp packaging/snap/snapcraft.yaml ./snapcraft.yaml

      - name: Build the snap
        run: /snap/bin/snapcraft pack --destructive-mode

      - name: Publish to the Snap Store (edge)
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: /snap/bin/snapcraft upload --release=edge *.snap
