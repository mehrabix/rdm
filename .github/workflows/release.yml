name: Release

# Triggered by a version tag (see docs/RELEASING.md). Builds a bundle per
# platform, signs it when the required secrets are configured, and attaches the
# artifacts to the GitHub Release for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            bundle_args: "--package-types appimage"
          - os: windows-latest
            target: windows-x86_64
            bundle_args: "--package-types msi"
          - os: macos-latest
            target: macos-arm64
            bundle_args: "--package-types macos --package-types dmg"
    runs-on: ${{ matrix.os }}

    # Optional signing credentials. Secrets can't be read in step-level `if:`
    # conditions, so presence is exposed as a boolean and the certs themselves
    # are scoped to the steps that use them. That matters: `dx bundle` reads
    # `APPLE_CERTIFICATE` directly and tries to import it, so an empty-but-set
    # value would make the macOS bundle fail.
    env:
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential

      # `dx` post-processes the release binary with `rustc-objcopy` (from the
      # `llvm-tools` component) to apply the profile's `strip` setting. Without
      # the component the strip step fails — and on macOS arm64 `rust-objcopy`
      # cannot load `libLLVM.dylib` — so install it on every runner.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Install the Dioxus CLI
        shell: bash
        run: |
          curl -sSL https://dioxus.dev/install.sh | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.dx/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile

      # NOTE: the icon assets (`assets/icon-*.png`) are committed and embedded
      # into the app with `include_bytes!`, so bundling does not need to
      # regenerate them. `scripts/make-icon.sh` is a local/dev tool (it needs
      # ImageMagick, which is not installed on the runners).

      # `dx bundle` compiles the release build *and* packages it. The `[bundle]`
      # section of `Dioxus.toml` supplies the identifier/publisher the desktop
      # bundler requires; `bundle_args` selects the installer format per
      # platform (AppImage / `.app` + `.dmg` / `.msi`). The release directory the
      # `.deb`, `.rpm` and tarball steps read is produced by the same build.
      - name: Bundle (release)
        shell: bash
        run: dx bundle --desktop --release ${{ matrix.bundle_args }}

      # The browser native-messaging host is a separate small binary. Windows
      # has no IPC transport yet, so it is built for the Unix targets only.
      - name: Build the browser native host (unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --release -p rdm-native-host
          install -m755 target/release/rdm-native-host "rdm-${{ matrix.target }}-native-host"

      # ---- macOS: sign + notarise -------------------------------------------
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm certificate.p12

      - name: Sign + notarise (macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        run: |
          APP=$(find target/dx -name '*.app' -type d | head -1)
          if [ -n "$APP" ]; then
            codesign --deep --force --options runtime --timestamp \
              --sign "$APPLE_SIGN_IDENTITY" "$APP"
            # Notarisation needs a zip; the staples ticket is applied to the
            # bundle afterwards and the signed bundle is zipped again in the
            # collect step so the released archive carries the ticket.
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/rdm-notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/rdm-notarize.zip" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$APP"
          fi

      # ---- Windows: Authenticode -------------------------------------------
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx",
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem -Recurse "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object FullName -Match 'x64' | Select-Object -Last 1 -ExpandProperty FullName
          Get-ChildItem -Recurse target/dx -Include *.exe,*.msi -ErrorAction SilentlyContinue |
            ForEach-Object {
              & $signtool sign /f cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
                /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
            }
          Remove-Item cert.pfx

      # ---- packaging --------------------------------------------------------
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf "rdm-${{ matrix.target }}.tar.gz" -C target/dx/rdm/release .
          if command -v shasum >/dev/null; then
            shasum -a 256 "rdm-${{ matrix.target }}.tar.gz" > "rdm-${{ matrix.target }}.tar.gz.sha256"
          else
            sha256sum "rdm-${{ matrix.target }}.tar.gz" > "rdm-${{ matrix.target }}.tar.gz.sha256"
          fi

      # Real installable packages (packaging/…), built from the release
      # directory rather than relying on `dx bundle`.
      - name: Build .deb + .rpm (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="$(find target/dx/rdm/release -maxdepth 3 -type d -name app | head -1)"

          bash packaging/linux/build-deb.sh "$APP" "$VERSION" . target/release/rdm-native-host
          sha256sum rdm_*.deb > rdm-deb.sha256

          sudo apt-get install -y rpm
          TOP="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$TOP"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp assets/icon-256.png "$TOP/SOURCES/rdm.png"
          # rpmbuild does not download Source URLs; hand it the tarball we built.
          cp "rdm-${{ matrix.target }}.tar.gz" "$TOP/SOURCES/"
          sed "s/^Version:.*/Version:        $VERSION/" packaging/rpm/rdm.spec > "$TOP/SPECS/rdm.spec"
          rpmbuild --define "_topdir $TOP" -bb "$TOP/SPECS/rdm.spec"
          find "$TOP/RPMS" -name '*.rpm' -exec cp {} . \;
          sha256sum rdm-*.rpm > rdm-rpm.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/dx/rdm/release/* -DestinationPath "rdm-${{ matrix.target }}.zip"
          Get-FileHash "rdm-${{ matrix.target }}.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  rdm-${{ matrix.target }}.zip" } |
            Out-File "rdm-${{ matrix.target }}.zip.sha256"

      # ---- collect the `dx bundle` installers -------------------------------
      - name: Collect the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          APPIMAGE="$(find target/dx -type f -name '*.AppImage' | head -1)"
          test -n "$APPIMAGE" || { echo "::error::dx bundle produced no AppImage"; exit 1; }
          cp "$APPIMAGE" "rdm-${{ matrix.target }}.AppImage"
          sha256sum "rdm-${{ matrix.target }}.AppImage" > "rdm-${{ matrix.target }}.AppImage.sha256"

      - name: Collect the .app and .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="$(find target/dx -type d -name '*.app' | head -1)"
          DMG="$(find target/dx -type f -name '*.dmg' | head -1)"
          test -n "$APP" || { echo "::error::dx bundle produced no .app"; exit 1; }
          test -n "$DMG" || { echo "::error::dx bundle produced no .dmg"; exit 1; }
          ditto -c -k --keepParent "$APP" "rdm-${{ matrix.target }}.app.zip"
          cp "$DMG" "rdm-${{ matrix.target }}.dmg"
          shasum -a 256 "rdm-${{ matrix.target }}.app.zip" > "rdm-${{ matrix.target }}.app.zip.sha256"
          shasum -a 256 "rdm-${{ matrix.target }}.dmg" > "rdm-${{ matrix.target }}.dmg.sha256"

      - name: Collect the MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Recurse target/dx -Filter *.msi | Select-Object -First 1
          if (-not $msi) { Write-Error "dx bundle produced no .msi"; exit 1 }
          Copy-Item $msi.FullName "rdm-${{ matrix.target }}.msi"
          $hash = (Get-FileHash "rdm-${{ matrix.target }}.msi" -Algorithm SHA256).Hash
          "$hash  rdm-${{ matrix.target }}.msi" | Out-File "rdm-${{ matrix.target }}.msi.sha256"

      # ---- Linux: sign the checksums with a GPG key -------------------------
      - name: Sign checksums (Linux)
        if: runner.os == 'Linux' && env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor "rdm-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rdm-${{ matrix.target }}.*
            rdm-${{ matrix.target }}-native-host
            rdm_*.deb
            rdm-*.rpm
            rdm-deb.sha256
            rdm-rpm.sha256
