name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The engine is pure Rust with no GUI dependencies, so it tests on one
  # runner and fast.
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rdm-core -p rdm-native-host

  # The desktop app must build — and bundle into an installer — on every
  # platform we ship. Bundling runs in debug mode here (cheap, no `rustc-objcopy`
  # strip) purely as a smoke test; `release.yml` does the signed release bundles.
  app:
    name: Build + bundle app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle_args: "--package-types appimage"
          - os: windows-latest
            bundle_args: "--package-types msi"
          - os: macos-latest
            bundle_args: "--package-types macos --package-types dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install the Dioxus CLI
        shell: bash
        run: |
          curl -sSL https://dioxus.dev/install.sh | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.dx/bin" >> "$GITHUB_PATH"

      # `dx` runs the Tailwind compiler itself, but the app's own tooling needs
      # node/pnpm present.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile

      # App-crate unit tests (i18n catalog parity/fallbacks). WebKitGTK is
      # already installed above for the Linux runner.
      - name: App unit tests (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p rdm

      - name: Bundle (debug)
        run: dx bundle --desktop ${{ matrix.bundle_args }}
