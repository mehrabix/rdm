[package]
name = "rdm"
description = "RDM — a fast, resumable, multi-connection download manager for Linux, Windows and macOS."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
dioxus = { version = "0.7" }
tw_merge = "0.1"
toml = "0.8"
rdm-core = { path = "crates/rdm-core" }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# `dx` selects one of these via `--no-default-features --features <platform>`.
[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[workspace]
members = ["crates/rdm-core", "crates/rdm-native-host"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"
authors = ["mehrabix <mehrabi@post.com>"]
repository = "https://github.com/mehrabix/rdm"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "net",
    "time",
    "sync",
    "process",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "rustls-native-certs",
    "stream",
    "gzip",
    "brotli",
    "json",
] }
futures = "0.3"
url = "2.5"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3.27"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
